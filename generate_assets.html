<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+SC:wght@400;500;600&family=Great+Vibes&display=swap">
    <title>Asset Generator</title>
</head>
<body style="background:#f0ede6; font-family:'Cormorant Garamond', serif; padding:20px;">
    <h2>Asset Generator</h2>
    <canvas id="cMonogram" width="588" height="640" style="border:1px solid #ccc; max-width:200px;"></canvas>
    <canvas id="cSchedule" width="576" height="1024" style="border:1px solid #ccc; max-width:200px;"></canvas>
    <canvas id="cReception" width="872" height="984" style="border:1px solid #ccc; max-width:200px;"></canvas>

    <script>
        window.results = {};

        async function init() {
            await document.fonts.ready;

            // 1. Monogram F | L
            const imgMono = new Image();
            imgMono.src = './assets/monogram-DluBM9hV.webp';
            await new Promise(r => imgMono.onload = r);

            const cm = document.getElementById('cMonogram');
            const ctxM = cm.getContext('2d');
            ctxM.drawImage(imgMono, 0, 0);

            // Clear center S | L area: circle in center
            ctxM.save();
            ctxM.globalCompositeOperation = 'destination-out';
            ctxM.beginPath();
            ctxM.ellipse(cm.width/2, cm.height/2 - 25, 140, 100, 0, 0, Math.PI * 2);
            ctxM.fill();
            ctxM.restore();

            // Draw F | L in center
            ctxM.fillStyle = '#1e2d42';
            ctxM.font = '500 130px "Cormorant Garamond", serif';
            ctxM.textAlign = 'center';
            ctxM.textBaseline = 'middle';
            
            // F
            ctxM.fillText('F', cm.width/2 - 70, cm.height/2 - 20);
            
            // Divider line
            ctxM.strokeStyle = '#1e2d42';
            ctxM.lineWidth = 3;
            ctxM.beginPath();
            ctxM.moveTo(cm.width/2, cm.height/2 - 105);
            ctxM.lineTo(cm.width/2, cm.height/2 + 65);
            ctxM.stroke();
            
            // L
            ctxM.fillText('L', cm.width/2 + 70, cm.height/2 - 20);
            window.results.monogram = cm.toDataURL('image/webp');

            // 2. Schedule Card (Holy Matrimony)
            const imgSched = new Image();
            imgSched.src = './assets/schedule-card-1-DVLF0AQy.webp';
            await new Promise(r => imgSched.onload = r);

            const cs = document.getElementById('cSchedule');
            const ctxS = cs.getContext('2d');
            ctxS.drawImage(imgSched, 0, 0);

            // Patch top date
            // The top date is around y: 170..200
            // We sample the background parchment color #f4efe4
            ctxS.fillStyle = '#f4efe4';
            ctxS.fillRect(160, 165, 260, 40);
            ctxS.fillStyle = '#1a2c5b';
            ctxS.font = '600 24px "Cormorant Garamond", serif';
            ctxS.textAlign = 'center';
            ctxS.fillText('30TH DECEMBER, 2026', cs.width/2, 192);

            // Patch title "Chanthamcharth" -> "Holy Matrimony"
            // Title is around y: 480..560
            ctxS.fillRect(80, 480, 416, 75);
            ctxS.fillStyle = '#1a2c5b';
            ctxS.font = 'italic 400 58px "Cormorant Garamond", serif';
            ctxS.fillText('Holy Matrimony', cs.width/2, 535);

            // Patch time "7:00 PM" -> "3:00 PM"
            // Around y: 580..605
            ctxS.fillRect(210, 580, 160, 30);
            ctxS.fillStyle = '#1a2c5b';
            ctxS.font = '600 20px "Cormorant SC", serif';
            ctxS.fillText('3:00 PM', cs.width/2, 600);

            // Patch venue: "VENUE : GRAND ARENA , ETTUMANOOR KOTTAYAM"
            // Around y: 620..675
            ctxS.fillRect(80, 620, 416, 55);
            ctxS.fillStyle = '#7a6744';
            ctxS.font = '600 16px "Cormorant SC", serif';
            ctxS.fillText('VENUE :', cs.width/2, 638);
            ctxS.fillStyle = '#1a2c5b';
            ctxS.font = '600 16px "Cormorant SC", serif';
            ctxS.fillText('ST. MARY\'S CHURCH , MADONA NAGAR , KACHERY', cs.width/2, 660);

            window.results.schedule = cs.toDataURL('image/webp');

            // 3. Reception Card
            const imgRecep = new Image();
            imgRecep.src = './assets/reception-content-BM7GeP99.webp';
            await new Promise(r => imgRecep.onload = r);

            const cr = document.getElementById('cReception');
            const ctxR = cr.getContext('2d');
            ctxR.drawImage(imgRecep, 0, 0);

            // Patch top date: 9TH JANUARY, 2027 -> 30TH DECEMBER, 2026
            // Around y: 90..150
            ctxR.fillStyle = '#ebe6dc';
            ctxR.fillRect(200, 90, 480, 60);
            ctxR.fillStyle = '#1a2c5b';
            ctxR.font = '600 38px "Cormorant Garamond", serif';
            ctxR.textAlign = 'center';
            ctxR.fillText('30TH DECEMBER, 2026', cr.width/2, 136);

            // Patch time: 7:30 PM -> 6:30 PM – 9:30 PM
            // Around y: 690..745
            ctxR.fillRect(250, 695, 370, 50);
            ctxR.fillStyle = '#1a2c5b';
            ctxR.font = '600 32px "Cormorant SC", serif';
            ctxR.fillText('6:30 PM – 9:30 PM', cr.width/2, 730);

            // Patch venue: Backwaters Ripples, Kumarakom -> REGENCY CLUB, KUTTANELLUR, THRISSUR
            // Around y: 800..860
            ctxR.fillRect(150, 805, 570, 60);
            ctxR.fillStyle = '#1a2c5b';
            ctxR.font = '600 28px "Cormorant SC", serif';
            ctxR.fillText('REGENCY CLUB, KUTTANELLUR, THRISSUR', cr.width/2, 840);

            window.results.reception = cr.toDataURL('image/webp');
            window.done = true;
        }

        init();
    </script>
</body>
</html>
